<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Added Marked.js for automatic Markdown to HTML rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Modern Dark AI Copilot Chat Styles */
        .chat-widget {
            position: relative;
            margin: 24px auto;
            width: 100%;
            max-width: 800px; /* Expanded slightly to accommodate data tables */
            height: 600px;
            background: #0b0f17;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            border: 1px solid #1e293b;
            color: #e2e8f0;
        }

        .chat-header {
            background: #0f172a;
            color: #ffffff;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1e293b;
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }

        .chat-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add-context {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-add-context:hover {
            background: #334155;
            color: #ffffff;
            border-color: #38bdf8;
        }

        .chat-header-tags {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #94a3b8;
        }

        .tag-pill {
            background: #1e293b;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #334155;
            font-size: 10px;
            color: #cbd5e1;
        }

        .chat-messages {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            background: #090d16;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-meta {
            font-size: 11px;
            color: #64748b;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            gap: 8px;
        }

        .message-group.user .message-meta {
            align-self: flex-end;
        }

        .message-group.bot .message-meta,
        .message-group.system .message-meta {
            align-self: flex-start;
        }

        .message {
            max-width: 95%;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        /* Message Types */
        .message.system {
            background-color: #111827;
            color: #94a3b8;
            border: 1px solid #1f2937;
            width: 100%;
            border-radius: 8px;
        }

        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: #ffffff;
            border-radius: 14px 14px 2px 14px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #0f172a;
            color: #cbd5e1;
            border: 1px solid #1e293b;
            width: 100%;
            border-radius: 8px;
        }

        .message.system-error {
            align-self: center;
            background-color: #450a0a;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
            font-size: 12px;
        }

        /* Improved Markdown Typography inside Bot Messages */
        .message.bot h1, .message.bot h2, .message.bot h3, .message.bot h4 {
            color: #38bdf8;
            margin: 14px 0 8px 0;
            font-weight: 600;
        }

        .message.bot h3 { font-size: 14px; }
        .message.bot h4 { font-size: 13px; }

        .message.bot p {
            margin: 0 0 10px 0;
        }

        .message.bot strong {
            color: #f8fafc;
        }

        .message.bot ul, .message.bot ol {
            margin: 6px 0 12px 0;
            padding-left: 20px;
        }

        .message.bot li {
            margin-bottom: 6px;
        }

        .message.bot hr {
            border: 0;
            height: 1px;
            background: #334155;
            margin: 16px 0;
        }

        /* Markdown Table Styling for Bot Responses */
        .bot-table-wrapper {
            overflow-x: auto;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .message.bot table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
            background: #1e293b;
        }

        .message.bot th {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 10px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 1px solid #334155;
            white-space: nowrap;
        }

        .message.bot td {
            padding: 10px 12px;
            border-bottom: 1px solid #1e293b;
            vertical-align: top;
            color: #cbd5e1;
        }

        .message.bot tr:last-child td {
            border-bottom: none;
        }

        .message.bot tr:hover {
            background-color: #283548;
        }

        .chat-input-area {
            display: flex;
            padding: 12px 16px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 13px;
            color: #f8fafc;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-area input::placeholder {
            color: #64748b;
        }

        .chat-input-area input:focus {
            border-color: #2563eb;
        }

        .chat-input-area button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover {
            background: #1d4ed8;
        }

        .typing-indicator {
            font-style: italic;
            color: #64748b;
            font-size: 12px;
        }

        /* Modal Context Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 16px;
            cursor: pointer;
        }

        .close-modal-btn:hover {
            color: #f8fafc;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            color: #f8fafc;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-cancel {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-submit {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <h1>Fraud Activity Monitor</h1>
        <div class="user-profile">
            <i class="fas fa-user-circle"></i>
            <span>account</span>
        </div>
    </header>

    <div class="main-dashboard-grid">
        <div class="table-card alert-table-card">
            <h2><i class="fas fa-exclamation-triangle"></i> Security Alerts</h2>
            <div class="table-container">
                <table id="alerts-table">
                    <thead>
                    <tr>
                        <th>Level</th>
                        <th>Time</th>
                        <th>User</th>
                        <th>Event</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="table-card activity-table-card">
            <h2><i class="fas fa-stream"></i> System Activity Log</h2>
            <div class="table-container">
                <table id="activity-table">
                    <thead>
                    <tr>
                        <th>Icon</th>
                        <th>Time</th>
                        <th>Activity</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- AI Copilot Chat Assistant Widget -->
    <div class="chat-widget">
        <div class="chat-header">
            <div class="chat-header-title">
                <span class="status-dot"></span>
                <span>AI COPILOT CHAT</span>
            </div>
            <div class="chat-header-actions">
                <button type="button" class="btn-add-context" id="open-context-modal">
                    <i class="fas fa-plus-circle"></i> Add Context
                </button>
                <div class="chat-header-tags">
                    <span class="tag-pill">Strict Compliance Guardrails</span>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- Initial System Welcome -->
            <div class="message-group system">
                <div class="message-meta">
                    <span>System</span>
                    <span>10:42 AM</span>
                </div>
                <div class="message system">
                    AI Fraud Investigation Agent initialized.
                </div>
            </div>
        </div>

        <form class="chat-input-area" id="chat-form">
            <input type="text" id="chat-input" placeholder="Type your query or instruction..." autocomplete="off" required>
            <button type="submit"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</div>

<!-- Modal Dialog for Adding Agent Prompt Context -->
<div class="modal-overlay" id="context-modal">
    <div class="modal-card">
        <div class="modal-header">
            <h3><i class="fas fa-brain"></i> Add Agent Prompt Context</h3>
            <button class="close-modal-btn" id="close-context-modal"><i class="fas fa-times"></i></button>
        </div>
        <form id="context-form">
            <div class="modal-body">
                <div class="form-group">
                    <label for="prompt-input">Prompt</label>
                    <input type="text" id="prompt-input" placeholder="Enter target prompt or scenario..." required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="context-input">Context</label>
                    <textarea id="context-input" rows="4" placeholder="Enter knowledge context or guidelines..." required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="cancel-context-modal">Cancel</button>
                <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Publish</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
<script>
    $(document).ready(function() {
        const $chatMessages =$('#chat-messages');
        const $chatForm =$('#chat-form');
        const $chatInput =$('#chat-input');

        // Configure Marked.js options
        marked.setOptions({
            breaks: true, // Render linebreaks as <br>
            gfm: true     // GitHub Flavored Markdown (tables, task lists)
        });

        // Modal Elements
        const $contextModal =$('#context-modal');
        const $openContextBtn =$('#open-context-modal');
        const $closeContextBtn =$('#close-context-modal, #cancel-context-modal');
        const $contextForm =$('#context-form');
        const $promptInput =$('#prompt-input');
        const $contextInput =$('#context-input');

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Scroll chat to the bottom
        function scrollToBottom() {
            $chatMessages.scrollTop($chatMessages[0].scrollHeight);
        }

        // Helper to render Markdown or HTML safe strings
        function formatMarkdownResponse(markdownText) {
            let parsedHtml = marked.parse(markdownText);
            // Wrap tables in responsive div container
            return parsedHtml.replace(/<table>/g, '<div class="bot-table-wrapper"><table>').replace(/<\/table>/g, '</table></div>');
        }

        // Append message with updated styling and sender metadata
        function appendMessage(text, sender, senderLabel, isMarkdown = false) {
            const timeStr = getCurrentTime();
            const label = senderLabel || (sender === 'user' ? 'Investigator' : 'AI Fraud Copilot');

            const content = isMarkdown ? formatMarkdownResponse(text) : text;

            const $group =$('<div>').addClass('message-group ' + sender);
            const $meta =$('<div>').addClass('message-meta').html(`<span>${label}</span><span>${timeStr}</span>`);
            const $msg =$('<div>').addClass('message ' + sender).html(content);

            $group.append($meta).append($msg);
            $chatMessages.append($group);
            scrollToBottom();
            return $group;
        }

        // Modal Actions
        $openContextBtn.on('click', function() {$contextModal.css('display', 'flex');
        });

        $closeContextBtn.on('click', function() {$contextModal.hide();
        });

        // Publish Agent Prompt & Context to Java Spring Endpoint
        $contextForm.on('submit', function(e) {
            e.preventDefault();

            const promptText = $promptInput.val().trim();
            const contextText = $contextInput.val().trim();

            if (!promptText || !contextText) return;

            $.ajax({
                url: `vector/search/prompt/context?prompt=${encodeURIComponent(promptText)}&context=${encodeURIComponent(contextText)}`,
                type: 'POST',
                success: function() {
                    $contextModal.hide();
                    $promptInput.val('');$contextInput.val('');
                    appendMessage(`Successfully published context for prompt: <strong>"${escapeHtml(promptText)}"</strong>`, 'system', 'System Context');
                },
                error: function(xhr, status, error) {
                    appendMessage('Failed to publish context to the server.', 'system-error', 'System Error');
                }
            });
        });

        // Handle Chat form submit
        $chatForm.on('submit', function(e) {
            e.preventDefault();
            const query = $chatInput.val().trim();
            if (!query) return;

            // Display user prompt
            appendMessage(escapeHtml(query), 'user', 'Investigator');
            $chatInput.val('');

            // Display loading indicator
            const $loadingGroup = appendMessage('<i class="fas fa-spinner fa-spin"></i> Analyzing knowledge base...', 'bot typing-indicator', 'AI Fraud Copilot');

            // Post request to vector search endpoint
            $.ajax({
                url: 'vector/search',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ query: query }),
                success: function(response) {
                    $loadingGroup.remove();

                    if (!response || response.length === 0) {
                        appendMessage("No relevant security guides or vector results found.", "bot");
                        return;
                    }

                    // Render LLM Markdown response directly
                    const text = typeof response === 'string' ? response : JSON.stringify(response);
                    appendMessage(text, 'bot', 'AI Fraud Copilot', true);
                },
                error: function(xhr, status, error) {
                    $loadingGroup.remove();
                    appendMessage('Failed to fetch search results. Please try again.', 'system-error', 'System Error');
                }
            });
        });

        // Helper function to sanitize user input against XSS
        function escapeHtml(str) {
            return $('<div>').text(str).html();
        }
    });
</script>
</body>
</html>
