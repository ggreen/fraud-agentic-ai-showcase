server:
  port: 0
spring:
  application:
    name: alert-sink
  rabbitmq:
    username: ${TANZU_RABBITMQ_USER}
    password: ${TANZU_RABBITMQ_PASSWORD}
  data:
    gemfire:
      pool:
        locators: "localhost[10334]"
  http:
    client:
      read-timeout: 60s
  cloud:
    function:
      definition: alertsConsumer
    stream:
      function:
        bindings:
          alertsConsumer-in-0: input
      binder:
        connection-name-prefix: ${spring.application.name}
      default:
        contentType: "application/json"
