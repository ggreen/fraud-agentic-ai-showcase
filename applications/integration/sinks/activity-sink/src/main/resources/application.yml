server:
  port: 0
spring:
  application:
    name: activity-sink
  rabbitmq:
    username: ${TANZU_RABBITMQ_USER}
    password: ${TANZU_RABBITMQ_PASSWORD}
  datasource:
    url: ${LC_GREENPLUM_JDBC_URL}
    username: ${LC_GREENPLUM_USER}
    password: ${LC_GREENPLUM_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties.hibernate.default_schema: fraud
    hibernate:
      ddl-auto: none
      show-sql: true
  liquibase:
    default-schema: fraud
    liquibase-schema: fraud
  http:
    client:
      read-timeout: 60s
  cloud:
    function:
      definition: activitiesConsumer
    stream:
      function:
        bindings:
          activitiesConsumer-in-0: input
      binder:
        connection-name-prefix: ${spring.application.name}
      default:
        contentType: "application/json"
